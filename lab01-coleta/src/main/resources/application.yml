# Lab01 - Configuração da coleta de dados
github:
  token: ${GITHUB_TOKEN}
  graphql:
    url: https://api.github.com/graphql
  rest:
    url: https://api.github.com
  total-repos: ${TOTAL_REPOS:100}
  # A API aceita até 100, mas com o bloco releases aninhado o GitHub estoura o próprio
  # tempo limite e responde 502. Repositórios caros de calcular (electron, tauri) derrubam
  # qualquer página que os contenha: com 100 falha sempre, com 25 falha na página deles.
  # Com 10 eles se separam e a coleta completa (100 repos em ~36s).
  page-size: ${PAGE_SIZE:10}
  amostra-prs-tamanho: ${AMOSTRA_PRS_TAMANHO:10}   # quantos PRs aceitos amostrar por repositório/ano

spring:
  main:
    # Não precisamos de servidor web: é um script/batch que roda e encerra
    web-application-type: none

logging:
  level:
    com.labes.coleta: INFO